# Stage 1 clean training: learn watermark embedding/extraction without screen
# degradation while keeping the residual in edge/texture regions. Run the
# three manual phases in order: warmup -> balance -> full. To switch phases,
# edit train.stage and start the next phase from the previous phase's best.pt
# with --init_from. Use --resume only to continue an interrupted phase.
#
# Start warmup from scratch (no --resume or --init_from):
#   D:/Anaconda_envs/envs/wadiff/python.exe train_watermark_diffusion.py \
#     --config configs/watermark_stage1.yaml
# For balance/full, edit train.stage and use --init_from with the previous
# phase's best.pt. Resume an interrupted phase with --resume instead.

initialization:
  require_checkpoint_for_stages: [balance, full]

data:
  train_dir: /root/autodl-tmp/datasets/train2017
  val_dir: /root/autodl-tmp/datasets/val2017
  image_size: 128
  watermark_length: 30
  watermark_seed: 42
  train_watermark_mode: random
  val_watermark_mode: deterministic_random
  max_train_images: 10000
  max_val_images: 1000

model:
  base_channels: 64
  cond_dim: 256
  use_pretrained_unet: false
  pretrained_path: null
  use_watermark_time_emb: true
  use_watermark_spatial_map: true
  wm_map_channels: 4
  wm_map_size: 16
  wm_time_scale: 1.0
  wm_map_scale: 1.0
  use_content_gated_wm_map: true
  wm_map_flat_floor: 0.05

decoder:
  type: residual_multiscale
  base_channels: 32
  hidden_dim: 512
  dropout: 0.1
  norm_groups: 8
  use_multiscale: true

diffusion:
  timesteps: 1000
  beta_schedule: linear
  wm_t_min: 0
  wm_t_max: 200
  train_t_start: 200
  sample_steps: 100

train:
  seed: 42
  deterministic: true
  batch_size: 32
  num_workers: 8
  lr: 0.0001
  encoder_train_mode: full
  epochs: 80
  device: cuda
  use_amp: true
  # Manually select exactly one of: warmup, balance, full.
  stage: full

  lambda_diff: 0.01
  lambda_img: 0.1
  lambda_wm: 20.0
  lambda_delta: 0.0
  lambda_tv: 0.0
  lambda_topk: 0.0
  lambda_channel: 0.0
  # Strict localization is active in every manual phase, but lambda_region is
  # deliberately small during warmup and tightened by balance/full.
  lambda_region: 0.5
  topk_delta_fraction: 0.01

  residual_constraint:
    enabled: true
    # Finer support: keep flat regions nearly clean and avoid saturated
    # colored outlines on the highest-confidence texture bands.
    flat_max_abs_delta_01: 0.004
    texture_max_abs_delta_01: 0.040
    mask_power: 2.2
    eps: 1.0e-6

  # Final Full-stage mask. Standalone sampling/evaluation also reads this
  # top-level version, so deployment uses the same fine support as Full.
  region_guidance:
    enabled: true
    mode: strict_multiscale
    loss_mode: energy_ratio
    # Favor unsmoothed/3-pixel edges and compact 3/5-pixel texture responses.
    # A 24% quantile support and lower temperature produce visibly thinner,
    # sharper guidance than the Warmup/Balance masks below.
    edge_scales: [1, 3]
    texture_scales: [3, 5]
    edge_weight: 0.70
    texture_weight: 0.30
    target_mask_area: 0.24
    mask_temperature: 0.03
    dilation_kernel: 1
    blur_kernel: 1
    gamma: 3.0
    min_penalty: 0.03
    min_active_area: 0.08
    start_inside_ratio: 0.65
    target_inside_ratio: 0.85
    start_max_outside_ratio: 0.35
    max_outside_ratio: 0.15
    ratio_warmup_steps: 5000
    warmup_steps: 1000

  # Default spectrum settings used unless the selected manual phase overrides
  # them below. These target narrow periodic stripes, not all high frequencies.
  residual_spectral:
    enabled: true
    start_step: 2000
    warmup_steps: 1000
    lambda_peak: 0.02
    lambda_anisotropy: 0.01
    max_peak_ratio: 0.20
    max_directional_ratio: 2.0

  use_loss_schedule: false
  loss_schedule: []

  stages:
    warmup:
      # A tiny full-timestep diffusion anchor prevents the hard residual
      # projection from hiding unbounded raw noise predictions.
      lambda_diff: 0.01
      lambda_img: 0.1
      lambda_wm: 20.0
      lambda_delta: 0.0
      lambda_tv: 0.0
      lambda_topk: 0.0
      lambda_channel: 0.0
      lambda_region: 0.10
      # Keep a wider support while the clean 30-bit channel is being
      # established. This prevents the finer Full mask from starving Warmup.
      region_guidance:
        enabled: true
        mode: strict_multiscale
        loss_mode: energy_ratio
        edge_scales: [1, 3, 5]
        texture_scales: [3, 5, 7]
        edge_weight: 0.55
        texture_weight: 0.45
        target_mask_area: 0.30
        mask_temperature: 0.05
        dilation_kernel: 1
        blur_kernel: 1
        gamma: 3.0
        min_penalty: 0.03
        min_active_area: 0.08
        start_inside_ratio: 0.65
        target_inside_ratio: 0.80
        start_max_outside_ratio: 0.35
        max_outside_ratio: 0.20
        ratio_warmup_steps: 5000
        warmup_steps: 1000
      # First establish a reliable clean watermark channel. Keep the fine
      # support mask, but avoid saturating tanh before bit conditioning learns.
      wm_map_flat_floor: 0.20
      residual_constraint:
        enabled: true
        flat_max_abs_delta_01: 0.012
        texture_max_abs_delta_01: 0.060
        mask_power: 1.0
        eps: 1.0e-6
      residual_spectral:
        enabled: false

    balance:
      # Tighten the carrier after warmup has learned a non-random bit channel.
      wm_map_flat_floor: 0.10
      # Intermediate support between Warmup and the final Full mask.
      region_guidance:
        enabled: true
        mode: strict_multiscale
        loss_mode: energy_ratio
        edge_scales: [1, 3]
        texture_scales: [3, 5]
        edge_weight: 0.65
        texture_weight: 0.35
        target_mask_area: 0.27
        mask_temperature: 0.04
        dilation_kernel: 1
        blur_kernel: 1
        gamma: 3.0
        min_penalty: 0.03
        min_active_area: 0.08
        start_inside_ratio: 0.65
        target_inside_ratio: 0.82
        start_max_outside_ratio: 0.35
        max_outside_ratio: 0.18
        ratio_warmup_steps: 5000
        warmup_steps: 1000
      residual_constraint:
        enabled: true
        flat_max_abs_delta_01: 0.007
        texture_max_abs_delta_01: 0.050
        mask_power: 1.6
        eps: 1.0e-6
      loss_schedule:
        - until_step: 3000
          lambda_diff: 0.01
          lambda_img: 0.1
          lambda_wm: 20.0
          lambda_delta: 0.0
          lambda_tv: 0.0
          lambda_topk: 0.0
          lambda_channel: 0.0
          lambda_region: 0.20
        - until_step: 5500
          lambda_diff: 0.05
          lambda_img: 0.5
          lambda_wm: 12.0
          lambda_delta: 0.0
          lambda_tv: 0.0
          lambda_topk: 0.0
          lambda_channel: 0.0
          lambda_region: 0.35
        - until_step: -1
          lambda_diff: 0.1
          lambda_img: 1.0
          lambda_wm: 8.0
          lambda_delta: 0.0
          lambda_tv: 0.0
          lambda_topk: 0.0
          lambda_channel: 0.0
          lambda_region: 0.50
      residual_spectral:
        enabled: true
        start_step: 2000
        warmup_steps: 1000
        lambda_peak: 0.01
        lambda_anisotropy: 0.005
        max_peak_ratio: 0.20
        max_directional_ratio: 2.0

    full:
      # Final deployment-quality strict spatial budget.
      wm_map_flat_floor: 0.03
      residual_constraint:
        enabled: true
        flat_max_abs_delta_01: 0.003
        texture_max_abs_delta_01: 0.040
        mask_power: 2.8
        eps: 1.0e-6
      lambda_diff: 0.3
      lambda_img: 3.0
      lambda_wm: 3.0
      lambda_delta: 0.05
      lambda_tv: 0
      lambda_topk: 0
      lambda_channel: 0.2
      lambda_region: 0.5
      residual_spectral:
        enabled: true
        start_step: 0
        warmup_steps: 1000
        lambda_peak: 0.02
        lambda_anisotropy: 0.01
        max_peak_ratio: 0.20
        max_directional_ratio: 2.0

  save_interval: 1
  sample_interval: 1000
  log_interval: 100
  debug_interval: 500
  reset_decoder: false

# Stage 1 trains clean embedding/extraction only.
noise_layer:
  type: none

output:
  # Dedicated strict Stage-1 paths: do not overwrite the previous Stage 1.
  checkpoint_dir: ./checkpoints_stage1_strict_texture_30bit_fine_v2
  sample_dir: ./outputs_stage1_strict_texture_30bit_fine_v2/samples
  log_dir: ./outputs_stage1_strict_texture_30bit_fine_v2/logs
